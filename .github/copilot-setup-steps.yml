# Copilot coding agent environment setup for gstack.
# Generated by gstack setup --host copilot.
# Customize as needed for your project's additional requirements.
steps:
  - name: Set up Bun
    uses: oven-sh/setup-bun@v2
  - name: Install gstack dependencies
    run: bun install --frozen-lockfile
  - name: Build gstack browse binary
    run: bun run build
  - name: Install Playwright browser
    run: bunx playwright install chromium
